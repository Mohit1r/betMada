<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BetMada $25,000 Wager Race Leaderboard | Stake Affiliate Community</title>
  
  <meta name="theme-color" content="#120720">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BetMada">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Check out the live $25,000 monthly wager race leaderboard for the BetMada Stake community. Join using promo code MADA to automatically qualify.">
  <meta name="keywords" content="BetMada leaderboard, Stake wager race, $25K leaderboard, Stake promo code MADA">
  
  <!-- Favicon Image -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Main Root Container -->
  <div id="app"></div>

  <!-- Dedicated Leaderboard JavaScript Module -->
  <script type="module">
    import { LeaderboardPage } from './js/leaderboardPage.js';
    import { AgeGate } from './js/ageGate.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      AgeGate.init();
      const root = document.getElementById('app');
      if (root) {
        root.innerHTML = LeaderboardPage.render();
        LeaderboardPage.attachEvents();
      }
    });
  </script>

</body>
</html>
